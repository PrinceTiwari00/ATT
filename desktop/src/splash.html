<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ATT Attendance</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(1200px 600px at 20% -10%, #1e293b 0%, #0f172a 55%, #0b1120 100%);
        color: #e2e8f0;
        overflow: hidden;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 28px 34px; text-align: center; }
      .logo {
        width: 62px; height: 62px; border-radius: 18px;
        display: grid; place-items: center;
        background: linear-gradient(140deg, #6366f1, #4f46e5 60%, #4338ca);
        box-shadow: 0 14px 34px rgba(79, 70, 229, .45);
      }
      .logo svg { width: 32px; height: 32px; }
      h1 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; color: #fff; }
      .sub { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; margin-top: -12px; }
      .msg { font-size: 13px; color: #cbd5e1; min-height: 20px; }
      .detail { font-size: 11.5px; color: #64748b; min-height: 16px; }
      .bar { width: 220px; height: 3px; border-radius: 999px; background: rgba(148,163,184,.22); overflow: hidden; }
      .bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: linear-gradient(90deg,#6366f1,#22d3ee); animation: slide 1.15s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-110%);} 100% { transform: translateX(320%);} }
      .err { display: none; max-width: 400px; font-size: 12px; line-height: 1.55; color: #fecdd3; background: rgba(190,18,60,.14);
             border: 1px solid rgba(244,63,94,.35); border-radius: 12px; padding: 12px 14px; text-align: left; }
      .foot { position: absolute; bottom: 14px; font-size: 10.5px; color: #475569; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 11a3 3 0 0 0-3 3v3" /><path d="M12 4a8 8 0 0 0-8 8" /><path d="M12 4a8 8 0 0 1 8 8c0 1.6-.3 3-.9 4.3" />
          <path d="M12 8a4 4 0 0 1 4 4v1" /><path d="M12 14v6" />
        </svg>
      </div>
      <h1>ATT Attendance</h1>
      <div class="sub">ZKTeco integrated tracking</div>
      <div class="bar"><i></i></div>
      <div class="msg" id="msg">Starting ATT…</div>
      <div class="detail" id="detail"></div>
      <div class="err" id="err"></div>
    </div>
    <div class="foot">Attendance keeps syncing in the background · data stays on this computer</div>
    <script>
      window.attSplash = ({ message, detail }) => {
        const m = document.getElementById('msg');
        const d = document.getElementById('detail');
        if (message) m.textContent = message;
        d.textContent = detail || '';
        document.getElementById('err').style.display = 'none';
      };
      window.attSplashError = ({ title, message }) => {
        const e = document.getElementById('err');
        document.getElementById('msg').textContent = title || 'Something went wrong';
        e.textContent = message || '';
        e.style.display = 'block';
        document.querySelector('.bar').style.display = 'none';
      };
    </script>
  </body>
</html>
